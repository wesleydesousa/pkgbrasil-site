name: Deploy PKGBRASIL to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare game covers
        run: |
          if [ -f "ativos/fotos_github_compactado.zip" ]; then
            rm -rf fotos
            unzip -q -o "ativos/fotos_github_compactado.zip" -d .
            echo "Game covers extracted: $(find fotos -type f -iname '*.jpg' | wc -l)"
            rm -f "ativos/fotos_github_compactado.zip"
          fi
          test -d fotos
      - name: Validate catalog
        run: python3 scripts/validate-catalog.py
      - name: Generate SEO game pages
        run: python3 scripts/generate-seo-pages.py

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4